name: Update Marketing Journal RSS Feeds

on:
  schedule:
    - cron: '0 */6 * * *'  # 每 6 小时自动运行
  workflow_dispatch:        # 支持在 Actions 页面手动一键触发

permissions:
  contents: write

concurrency:
  group: rss-update
  cancel-in-progress: false

jobs:
  update-feeds:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate RSS Feeds & Dashboard
        run: |
          python src/generate_feeds.py

      - name: Commit and push if changed
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "No feed changes detected."
          else
            git commit -m "chore(rss): auto-update journal feeds [skip ci]"

            MAX_RETRIES=3
            DELAY_SECONDS=3
            ATTEMPT=1
            SUCCESS=false

            while [ $ATTEMPT -le $MAX_RETRIES ]; do
              echo "Push attempt $ATTEMPT of $MAX_RETRIES..."
              if git push origin HEAD:main; then
                echo "Push succeeded on attempt $ATTEMPT."
                SUCCESS=true
                break
              fi

              echo "Push rejected. Fetching latest origin/main and rebasing..."
              if ! git fetch origin main; then
                echo "Failed to fetch origin/main."
              elif ! git rebase origin/main; then
                echo "Rebase conflict encountered; aborting rebase."
                git rebase --abort || true
                break
              fi

              echo "Rebase successful. Waiting ${DELAY_SECONDS}s before retrying push..."
              sleep $DELAY_SECONDS
              ATTEMPT=$((ATTEMPT + 1))
            done

            if [ "$SUCCESS" != "true" ]; then
              echo "Error: Failed to push feed updates to origin/main after $MAX_RETRIES attempts."
              exit 1
            fi
          fi
